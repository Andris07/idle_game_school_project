<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/colors.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <script src="./js/app.js" defer></script>
</head>

<body data-theme="dark">
    <main class="container">
        <div id="shopgrid" class="itemcont">
            <div id="chests" class="item">
                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/shape_chest.png" alt="Shape Chest" title="Shape Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>

                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/upgrade_chest.png" alt="Upgrade Chest" title="Upgrade Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>

                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/buff_chest.png" alt="Buff Chest" title="Buff Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>
            </div>

            <hr>

            <div id="inventory" class="item">

            </div>
        </div>

        <div id="playgrid" class="itemcont">
        
        </div>
    </main>

    <footer>
        Készítette:<br>
        <a href="https://github.com/BudahazyBotond" target="_blank">Budaházy Botond</a><br>
        <a href="https://github.com/Andris07" target="_blank">Laczkovics András Gergő</a>
    </footer>
</body>
</html>
