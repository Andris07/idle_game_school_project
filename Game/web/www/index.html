<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/colors.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <script src="./js/app.js" defer></script>
    <script src="./js/theme.js" defer></script>
</head>

<body data-theme="dark">
    <nav class="menu">
        <!-- LEFT: Project repository -->
        <div class="menu-section menu-repository">
            <a class="repository-link" href="https://github.com/Andris07/idle_game_school_project" target="_blank">
                <span class="repo-icon">Project Repository</span>
            </a>
        </div>

        <!-- CENTER: Game information -->
        <div class="menu-section menu-info">
            <!--
                Placeholder for future information.
                Examples:
                - QTE type
                - QTE timer
                - money
            -->

            <div class="game-info">
                <span id="game-timer" class="game-info-item">
                    --:--
                </span>

                <span class="game-info-separator">|</span>

                <span id="player-money" class="game-info-item">
                    $$$
                </span>
            </div>
        </div>

        <!-- RIGHT: Theme toggle -->
        <div class="menu-section menu-theme">
            <button id="theme-toggle" class="theme-toggle" type="button">
                <span class="theme-icon"></span>
            </button>
        </div>
    </nav>

    <main class="container">
        <div id="shopgrid" class="itemcont">
            <div id="chests" class="item">
                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/shape_chest.png" alt="Shape Chest" title="Shape Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>

                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/upgrade_chest.png" alt="Upgrade Chest" title="Upgrade Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>

                <div class="chest">
                    <div class="chest-img">
                        <img src="./src/buff_chest.png" alt="Buff Chest" title="Buff Chest">
                    </div>
                    <div class="chest-button">
                        <button class="buy-button">$$$</button>
                    </div>
                </div>
            </div>

            <hr>

            <div id="inventory" class="item">

            </div>
        </div>

        <div id="playgrid" class="itemcont">
        
        </div>
    </main>

    <footer>
        Készítette:<br>
        <a href="https://github.com/BudahazyBotond" target="_blank">Budaházy Botond</a><br>
        <a href="https://github.com/Andris07" target="_blank">Laczkovics András Gergő</a>
    </footer>
</body>
</html>
